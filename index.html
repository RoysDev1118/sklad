<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Складской поиск + Native Сканер</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; }
        h2 { margin-top: 0; color: #1c1c1e; font-size: 20px; text-align: center; }
        
        .scan-btn { width: 100%; padding: 14px; background-color: #34c759; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        #videoContainer { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 15px; display: none; background: #000; position: relative; height: 280px; }
        #webcamVideo { width: 100%; height: 100%; object-fit: cover; }
        
        .divider { text-align: center; color: #8e8e93; font-size: 12px; margin: 10px 0 15px 0; position: relative; }
        .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: #e5e5ea; }
        .divider::before { left: 0; } .divider::after { right: 0; }

        input { width: 100%; padding: 14px; border: 1px solid #c7c7cc; border-radius: 8px; font-size: 18px; margin-bottom: 15px; outline: none; text-align: center; letter-spacing: 2px; }
        input:focus { border-color: #007aff; }
        .search-btn { width: 100%; padding: 14px; background-color: #007aff; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* Заголовок ячейки над карточками */
        .address-header { margin-top: 20px; font-size: 18px; color: #1c1c1e; font-weight: bold; text-align: center; display: none; }
        .address-header span { color: #007aff; }

        /* Стили карточек товаров внутри ячейки */
        .result-card { margin-top: 12px; padding: 15px; border-radius: 8px; background-color: #f8f9fa; border-left: 5px solid #007aff; }
        /* Если это сборная позиция СБХран+, подсветим её оранжевым */
        .result-card.multi-item { border-left-color: #ff9500; }
        
        .result-item { margin-bottom: 10px; font-size: 15px; color: #2c3e50; }
        .result-item strong { color: #7f8c8d; font-size: 11px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .sku-badge { background-color: #e5e5ea; color: #3a3a3c; padding: 2px 6px; border-radius: 4px; font-size: 13px; font-weight: 600; }
        .sku-none { color: #8e8e93; font-style: italic; }

        .analogs-section { margin-top: 20px; display: none; width: 100%; }
        .analogs-title { font-size: 14px; font-weight: bold; color: #3a3a3c; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .analog-row { background: #f1f3f5; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; border-left: 3px solid #636366; }
        .analog-address { font-weight: bold; }
        .analog-qty { text-align: right; font-weight: bold; color: #248a3d; }
        .analog-meta { grid-column: span 2; font-size: 12px; color: #636366; border-top: 1px dashed #d1d1d6; padding-top: 4px; margin-top: 4px; }
        
        .error { color: #ff3b30; background: #ffe5e5; padding: 12px; border-radius: 8px; margin-top: 15px; display: none; text-align: center; font-size: 14px; }
        .version-tag { text-align: center; font-size: 11px; color: #c7c7cc; margin-top: 25px; font-weight: 500; letter-spacing: 0.5px; text-transform: lowercase; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔎 Складской поиск+</h2>

 <!-- БЛОК АВТОРИЗАЦИИ КЛАДОВЩИКА -->
    <div id="authBlock" style="background: #e5e5ea; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 12px; font-weight: bold; color: #3a3a3c; text-transform: uppercase;">👤 Авторизация сотрудника</div>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="pickerNameInput" placeholder="Имя (4 буквы)" max-length="10" style="margin-bottom: 0; padding: 8px; font-size: 15px; letter-spacing: 0; text-align: left;">
            <button onclick="loginPicker()" style="padding: 8px 15px; background: #5856d6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;">Войти</button>
        </div>
        <div id="authStatus" style="font-size: 13px; color: #636366; font-weight: 500;">Режим: 👀 Только просмотр</div>
    </div>
    
    <button class="scan-btn" id="toggleScanBtn" onclick="toggleScanner()">📷 Включить сканер</button>
    <div id="videoContainer">
        <video id="webcamVideo" autoplay playsinline muted></video>
    </div>

    <div class="divider">или введите вручную</div>

    <input type="text" id="addressInput" placeholder="1012 или 1-01-2" autocomplete="off">
    <button class="search-btn" onclick="searchAddress()">Найти данные</button>

    <div id="errorBlock" class="error"></div>

    <!-- Заголовок с адресом текущей ячейки -->
    <div id="addressHeader" class="address-header">Ячейка: <span id="targetAddressTitle">-</span></div>
    
    <!-- Контейнер для динамических карточек товаров -->
    <div id="productsContainer"></div>

    <div id="analogsSection" class="analogs-section">
        <div class="analogs-title">Также этот товар лежит в ячейках:</div>
        <div id="analogsList"></div>
    </div>

    <div class="version-tag">сборка: 1.3.1 (сборные ячейки)</div>
</div>
<script>
    // ==================================================
    // === НАСТРОЙКИ SUPABASE (ПОДСТАВЬТЕ СВОИ ДАННЫЕ) ===
    const SUPABASE_URL = "https://qxpnzaokqdctnfiqrrvx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4cG56YW9rcWRjdG5maXFycnZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MzA1OTAsImV4cCI6MjEwNjAwNjU5MH0.F8Or6x0QaghtTd4I_CZZA1LkXkgGYrbDraDmudQCEAc";
    // ==================================================
    let videoStream = null;
    let scanInterval = null;
 let currentPicker = null; // Хранит имя авторизованного кладовщика (4 буквы)

    // Функция авторизации
    async function loginPicker() {
        let nameInput = document.getElementById('pickerNameInput').value.trim();
        const statusDiv = document.getElementById('authStatus');
        document.getElementById('errorBlock').style.display = 'none';

        if (!nameInput) {
            statusDiv.innerHTML = "Режим: 👀 Только просмотр";
            statusDiv.style.color = "#636366";
            currentPicker = null;
            return;
        }

        // Приводим к формату: Первая заглавная, остальные строчные (например, вова -> Вова, roys -> Roys)
        let formattedName = nameInput.charAt(0).toUpperCase() + nameInput.slice(1).toLowerCase();

        try {
            // Проверяем имя в таблице allowed_pickers в Supabase
            const response = await fetch(`${SUPABASE_URL}/rest/v1/allowed_pickers?name=eq.${encodeURIComponent(formattedName)}`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const data = await response.json();

            if (data.length > 0) {
                currentPicker = data[0].name;
                statusDiv.innerHTML = `✅ Доступ разрешен: <strong>${currentPicker}</strong> (Списания открыты)`;
                statusDiv.style.color = "#248a3d";
                document.getElementById('pickerNameInput').value = currentPicker;
            } else {
                currentPicker = null;
                statusDiv.innerHTML = "❌ Имя не найдено в списке. Режим: 👀 Только просмотр";
                statusDiv.style.color = "#ff3b30";
            }
        } catch (err) {
            showError("Ошибка проверки пользователя: " + err.message);
        }
    }
 // ==================================================
    async function toggleScanner() {
        const videoContainer = document.getElementById('videoContainer');
        const video = document.getElementById('webcamVideo');
        const btn = document.getElementById('toggleScanBtn');
        document.getElementById('errorBlock').style.display = 'none';

        if (!videoStream) {
            try {
                videoContainer.style.display = 'block';
                btn.innerText = "🛑 Остановить сканер";
                btn.style.backgroundColor = "#ff3b30";

                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                
                video.srcObject = videoStream;
                await video.play();

                if (!window.BarcodeDetector) {
                    showError("Встроенный сканер не поддерживается. Используйте ручной ввод.");
                    return;
                }

                const barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });

                scanInterval = setInterval(async () => {
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        try {
                            const barcodes = await barcodeDetector.detect(video);
                            if (barcodes.length > 0) {
                                document.getElementById('addressInput').value = barcodes[0].rawValue;
                                stopCamera();
                                searchAddress();
                            }
                        } catch (e) { }
                    }
                }, 300);

            } catch (err) {
                showError("Не удалось получить доступ к камере: " + err.message);
                stopCamera();
            }
        } else {
            stopCamera();
        }
    }

    function stopCamera() {
        const videoContainer = document.getElementById('videoContainer');
        const video = document.getElementById('webcamVideo');
        const btn = document.getElementById('toggleScanBtn');

        if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
        if (videoStream) { videoStream.getTracks().forEach(track => track.stop()); videoStream = null; }

        video.srcObject = null;
        videoContainer.style.display = 'none';
        btn.innerText = "📷 Включить сканер";
        btn.style.backgroundColor = "#34c759";
    }

    // ГЛАВНЫЙ ДИСПЕТЧЕР ПОИСКА
    async function searchAddress() {
        let inputValue = document.getElementById('addressInput').value.trim();
        
        // Очищаем экраны перед новым поиском
        document.getElementById('addressHeader').style.display = 'none';
        document.getElementById('productsContainer').innerHTML = '';
        document.getElementById('analogsSection').style.display = 'none';
        document.getElementById('analogsList').innerHTML = '';
        document.getElementById('errorBlock').style.display = 'none';

        if (!inputValue) {
            showError("Пожалуйста, введите или отсканируйте данные");
            return;
        }

        // СЦЕНАРИЙ 1: Поиск по АРТИКУЛУ (метка #)
        if (inputValue.startsWith('#')) {
            const cleanSku = inputValue.substring(1).trim();
            if (!cleanSku) { showError("Артикул после # не может быть пустым"); return; }
            await executeSkuSearch(cleanSku);
            return;
        }

        // Предобработка ввода для ячеек и гибридов (авто-дефисы, если ввели слитно, например 2хх5 или 10015)
        if (!inputValue.includes('-')) {
            let clean = inputValue.toLowerCase();
            if (clean.length === 4) { // формат 2хх5 -> 2-хх-5 или 1012 -> 1-01-2
                inputValue = `${clean.charAt(0)}-${clean.substring(1,3)}-${clean.charAt(3)}`;
            } else if (clean.length === 5) { // формат 10хх5 -> 10-хх-5 или 10015 -> 10-01-5
                inputValue = `${clean.substring(0,2)}-${clean.substring(2,4)}-${clean.charAt(4)}`;
            }
        }

        // СЦЕНАРИЙ 2: ГИБРИДНЫЙ ПОИСК (маска содержит "хх")
        if (inputValue.toLowerCase().includes('хх') || inputValue.includes('xx')) {
            // Приводим русское "х" и английское "x" к общему виду для Supabase
            const dbSearchMask = inputValue.toLowerCase().replace(/x/g, '%').replace(/х/g, '%');
            await executeHybridSearch(dbSearchMask, inputValue);
            return;
        }

        // СЦЕНАРИЙ 3: ОБЫЧНЫЙ ПОИСК КОНКРЕТНОЙ ЯЧЕЙКИ (текущий рабочий режим)
        await executeCellSearch(inputValue);
    }
    // ==================================================
    // === ИСПОЛНИТЕЛЬ СЦЕНАРИЯ 3: ПОИСК КОНКРЕТНОЙ ЯЧЕЙКИ ===
async function executeCellSearch(addressValue) {
        const addressHeader = document.getElementById('addressHeader');
        const productsContainer = document.getElementById('productsContainer');
        const analogsSection = document.getElementById('analogsSection');
        const analogsList = document.getElementById('analogsList');

        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/test_products?address=eq.${encodeURIComponent(addressValue)}`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            if (!response.ok) throw new Error(`Ошибка сервера: ${response.status}`);
            const targetData = await response.json();

            const validItems = targetData.filter(item => item.title && item.title.trim() !== "");
            if (validItems.length === 0) {
                showError(`Ячейка ${addressValue} пуста.`);
                return;
            }

            document.getElementById('targetAddressTitle').innerText = addressValue;
            addressHeader.style.display = 'block';

            const isMultiItem = validItems.length > 1;

            validItems.forEach(targetItem => {
                let skuHtml = targetItem.sku && targetItem.sku !== '0' && targetItem.sku.trim() !== '' 
                    ? `<span class="sku-badge">${targetItem.sku}</span>` 
                    : '<span class="sku-none">без артикула</span>';

                const displayUnit = targetItem.unit ? targetItem.unit : 'шт.';
                const cardClass = (isMultiItem || targetItem.purpose === 'СБХран+') ? 'result-card multi-item' : 'result-card';
                
                // РАСЧЕТ И ОТРИСОВКА БЛОКА СПИСАНИЯ
                let actionBlockHtml = '';
                const itemQty = targetItem.quantity !== null ? targetItem.quantity : 0;
                
                if (targetItem.status === 'locked') {
                    // Если палета заблокирована
                    actionBlockHtml = `
                        <div style="margin-top: 12px; padding: 10px; background: #ffe5e5; border-radius: 6px; border: 1px solid #ff3b30; color: #ff3b30; font-size: 13px; font-weight: bold; text-align: center;">
                            🛑 ПАЛЕТА БЛОКИРОВАНА: Уже взята в работу!
                        </div>`;
                } else if (itemQty > 0) {
                    // Если товар доступен и его количество > 0
                    if (currentPicker) {
                        // Если кладовщик авторизован — показываем кнопку и ввод количества
                        actionBlockHtml = `
                            <div style="margin-top: 15px; padding-top: 12px; border-top: 1px dashed #c7c7cc; display: flex; flex-direction: column; gap: 8px;">
                                <div style="font-size: 12px; font-weight: bold; color: #5856d6; text-transform: uppercase;">Списание позиции:</div>
                                <div style="display: flex; gap: 8px; align-items: center;">
                                    <input type="number" id="claimQty_${targetItem.id}" value="${itemQty}" min="1" max="${itemQty}" 
                                           style="width: 80px; margin-bottom: 0; padding: 8px; font-size: 15px; letter-spacing: 0; text-align: center;">
                                    <span style="font-size: 14px; color: #505050; font-weight: 500;">${displayUnit}</span>
                                    <button onclick="createOrderClaim(${targetItem.id}, '${escapeHtml(targetItem.sku || '')}', '${escapeHtml(targetItem.title)}', '${escapeHtml(targetItem.address)}', '${escapeHtml(targetItem.purpose || '')}', '${displayUnit}', '${escapeHtml(targetItem.batch || '')}', '${targetItem.production_date || ''}')"  
                                            style="flex: 1; padding: 10px; background-color: #5856d6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;">
                                        Взять в работу
                                    </button>
                                </div>
                            </div>`;
                    } else {
                        // Если зашел как гость (просмотр)
                        actionBlockHtml = `
                            <div style="margin-top: 12px; font-size: 12px; color: #8e8e93; text-align: center; font-style: italic;">
                                Авторизуйтесь, чтобы активировать списание товара.
                            </div>`;
                    }
                }

                productsContainer.innerHTML += `
                    <div class="${cardClass}">
                        <div class="result-item"><strong>Артикул:</strong> ${skuHtml}</div>
                        <div class="result-item"><strong>Наименование продукции:</strong> <span style="font-weight: 500;">${targetItem.title}</span></div>
                        <div class="result-item"><strong>Назначение:</strong> <span>${targetItem.purpose || '—'}</span></div>
                        <div class="result-item"><strong>Количество здесь:</strong> <span>${itemQty} ${displayUnit}</span></div>
                        <div class="result-item"><strong>Партия:</strong> <span>${targetItem.batch || '—'}</span></div>
                        <div class="result-item"><strong>Дата производства:</strong> <span>${targetItem.production_date || '—'}</span></div>
                        ${actionBlockHtml}
                    </div>
                `;
            });

            if (isMultiItem) return; 

            const singleProductTitle = validItems[0].title;
            const responseAnalogs = await fetch(`${SUPABASE_URL}/rest/v1/test_products?title=eq.${encodeURIComponent(singleProductTitle)}&address=neq.${encodeURIComponent(addressValue)}`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const analogsData = await responseAnalogs.json();

            if (analogsData.length > 0) {
                analogsData.sort((a, b) => {
                    const dateA = a.production_date ? new Date(a.production_date).getTime() : Infinity;
                    const dateB = b.production_date ? new Date(b.production_date).getTime() : Infinity;
                    if (dateA !== dateB) return dateA - dateB;
                    return (a.quantity !== null ? a.quantity : 0) - (b.quantity !== null ? b.quantity : 0);
                });

                const cellAddresses = [...new Set(analogsData.map(item => item.address))];
                renderAnalogsListWithMixCheck(analogsData, cellAddresses);
            }

        } catch (error) { showError(`Ошибка: ${error.message}`); }
    }

    // Вспомогательная техническая функция защиты от кавычек в тексте
    function escapeHtml(string) {
        return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    // ==================================================
 // === ИСПОЛНИТЕЛЬ СЦЕНАРИЯ 2: ГИБРИДНЫЙ ПОИСК (УРОВЕНЬ СТЕЛЛАЖА) ===
    async function executeHybridSearch(dbSearchMask, originalInput) {
        const addressHeader = document.getElementById('addressHeader');
        const productsContainer = document.getElementById('productsContainer');

        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/test_products?address=like.${encodeURIComponent(dbSearchMask)}`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            if (!response.ok) throw new Error(`Ошибка сервера: ${response.status}`);
            const data = await response.json();

            const validItems = data.filter(item => item.title && item.title.trim() !== "");
            if (validItems.length === 0) {
                showError(`На уровне стеллажа по запросу "${originalInput}" товаров не найдено.`);
                return;
            }

            // Группируем товары по ячейкам для выявления миксов
            const cellsMap = {};
            validItems.forEach(item => {
                if (!cellsMap[item.address]) {
                    cellsMap[item.address] = [];
                }
                cellsMap[item.address].push(item);
            });

            // Получаем уникальные адреса и сортируем их по порядку
            const sortedAddresses = Object.keys(cellsMap).sort((a, b) => a.localeCompare(b));

            document.getElementById('targetAddressTitle').innerText = originalInput.toUpperCase();
            addressHeader.style.display = 'block';

            sortedAddresses.forEach(addr => {
                const itemsInCell = cellsMap[addr];
                // Ячейка сборная, если в ней > 1 товара или хотя бы у одного назначение СБХран+
                const isMix = itemsInCell.length > 1 || itemsInCell.some(i => i.purpose === 'СБХран+');

                if (isMix) {
                    // Оранжевая карточка для микс-палета
                    productsContainer.innerHTML += `
                        <div class="result-card multi-item" style="border-left-color: #ff9500; background-color: #fff9f0;">
                            <div class="result-item" style="font-size: 16px; color: #ff9500;"><strong>📍 Адрес хранения:</strong> <span style="font-weight: bold;">${addr}</span></div>
                            <div class="result-item" style="font-weight: bold; color: #d97706; margin-top: 5px;">⚠️ СБОРНЫЙ МИКС-ПАЛЕТ (СБХран)</div>
                            <div class="result-item" style="font-size: 12px; color: #7f8c8d;">Состав скрыт. Для просмотра отсканируйте ячейку напрямую.</div>
                        </div>
                    `;
                } else {
                    // Обычная карточка для моно-палета
                    const item = itemsInCell[0];
                    let skuHtml = item.sku && item.sku !== '0' && item.sku.trim() !== '' 
                        ? `<span class="sku-badge">${item.sku}</span>` 
                        : '<span class="sku-none">без артикула</span>';

                    const displayUnit = item.unit ? item.unit : 'шт.';

                    productsContainer.innerHTML += `
                        <div class="result-card" style="border-left-color: #34c759;">
                            <div class="result-item" style="font-size: 16px; color: #34c759;"><strong>📍 Адрес хранения:</strong> <span>${item.address}</span></div>
                            <div class="result-item"><strong>Артикул:</strong> ${skuHtml}</div>
                            <div class="result-item"><strong>Наименование продукции:</strong> <span style="font-weight: 500;">${item.title}</span></div>
                            <div class="result-item"><strong>Количество:</strong> <span>${item.quantity !== null ? item.quantity : 0} ${displayUnit}</span></div>
                            <div class="result-item"><strong>Дата производства:</strong> <span>${item.production_date || '—'}</span></div>
                        </div>
                    `;
                }
            });

        } catch (error) { showError(`Ошибка гибридного поиска: ${error.message}`); }
    }
    // ==================================================
    // ==================================================
    // === ИСПОЛНИТЕЛЬ СЦЕНАРИЯ 1: ПОИСК ПО АРТИКУЛУ SKU ===
    async function executeSkuSearch(skuValue) {
        const addressHeader = document.getElementById('addressHeader');
        const productsContainer = document.getElementById('productsContainer');

        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/test_products?sku=eq.${encodeURIComponent(skuValue)}`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            if (!response.ok) throw new Error(`Ошибка сервера: ${response.status}`);
            const data = await response.json();

            const validItems = data.filter(item => item.title && item.title.trim() !== "");
            if (validItems.length === 0) {
                showError(`Товар с артикулом "${skuValue}" не найден в базе остатков.`);
                return;
            }

            const productInfo = validItems[0];
            
            document.getElementById('targetAddressTitle').innerText = `Арт: ${skuValue}`;
            addressHeader.style.display = 'block';

            // Выводим только карточку-справку о товаре БЕЗ НАЗНАЧЕНИЯ
            productsContainer.innerHTML = `
                <div class="result-card" style="border-left-color: #5856d6; background-color: #f0effb;">
                    <div class="result-item"><strong style="color: #5856d6;">Найденный товар:</strong> <span style="font-weight: bold; font-size: 16px;">${productInfo.title}</span></div>
                </div>
            `;

            // Сортируем все ячейки по правилу FEFO + минимизация остатка
            validItems.sort((a, b) => {
                const dateA = a.production_date ? new Date(a.production_date).getTime() : Infinity;
                const dateB = b.production_date ? new Date(b.production_date).getTime() : Infinity;
                if (dateA !== dateB) return dateA - dateB;
                return (a.quantity !== null ? a.quantity : 0) - (b.quantity !== null ? b.quantity : 0);
            });

            // Запрашиваем информацию о сборных палетах, чтобы подсветить миксы
            // Нам нужно знать, какие еще товары лежат в этих же ячейках
            const cellAddresses = [...new Set(validItems.map(item => item.address))];
            
            // Передаем данные в обновленный рендеринг
            await renderAnalogsListWithMixCheck(validItems, cellAddresses);

        } catch (error) { showError(`Ошибка поиска по артикулу: ${error.message}`); }
    }

    // МОДИФИЦИРОВАННАЯ ФУНКЦИЯ: КНОПКИ «ЗАБРАТЬ» ДОСТУПНЫ В АНАЛОГАХ ПРИ ЛЮБОМ ПОИСКЕ
    async function renderAnalogsListWithMixCheck(arrayData, cellAddresses) {
        const analogsSection = document.getElementById('analogsSection');
        const analogsList = document.getElementById('analogsList');
        analogsList.innerHTML = '';
        
        const isSkuSearch = document.getElementById('targetAddressTitle').innerText.includes('Арт:');
        analogsSection.querySelector('.analogs-title').innerText = isSkuSearch 
            ? "Адреса размещения товара на складе (Приоритет FIFO):" 
            : "Также этот товар лежит в ячейках:";

        arrayData.forEach(item => {
            const unitStr = item.unit ? item.unit : 'шт.';
            let skuBadgeHtml = item.sku && item.sku !== '0' && item.sku.trim() !== '' 
                ? `<span class="sku-badge" style="font-size:11px; padding:1px 4px;">Арт: ${item.sku}</span>` 
                : '<span class="sku-none" style="font-size:11px;">без арт.</span>';

            const itemPurpose = item.purpose ? item.purpose.trim() : '';
            const isMix = itemPurpose === 'СБХран' || itemPurpose === 'СБХран+';
            
            const rowStyle = isMix 
                ? 'border-left: 4px solid #ff9500; background: #fff9f0;' 
                : 'border-left: 4px solid #5856d6;';

            // ИЗМЕНЕННАЯ ЛОГИКА: Убрали привязку к isSkuSearch. 
            // Кнопка появится везде (и при поиске ячейки, и при поиске артикула), если палета не микс и qty > 0
            let claimBlockHtml = '';
            const itemQty = item.quantity !== null ? item.quantity : 0;

            if (!isMix && itemQty > 0) {
                if (item.status === 'locked') {
                    claimBlockHtml = `<div style="color:#ff3b30; font-size:11px; font-weight:bold; margin-top:5px;">🛑 БЛОКИРОВАН (В работе)</div>`;
                } else if (currentPicker) {
                    claimBlockHtml = `
                        <div style="margin-top: 8px; display: flex; gap: 6px; align-items: center; border-top: 1px dashed #d1d1d6; padding-top: 6px;">
                            <input type="number" id="claimQty_analog_${item.id}" value="${itemQty}" min="1" max="${itemQty}" 
                                   style="width: 65px; padding: 4px; font-size: 13px; text-align: center; border: 1px solid #c7c7cc; border-radius: 4px;">
                            <button onclick="createOrderClaim(${item.id}, '${escapeHtml(item.sku || '')}', '${escapeHtml(item.title)}', '${escapeHtml(item.address)}', '${escapeHtml(item.purpose || '')}', '${unitStr}', '${escapeHtml(item.batch || '')}', '${item.production_date || ''}')" 
                                    style="padding: 4px 10px; background: #5856d6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px;">
                                Забрать
                            </button>
                        </div>`;
                }
            }

            analogsList.innerHTML += `
                <div class="analog-row" style="${rowStyle} display: flex; flex-direction: column; gap: 2px;">
                    <div style="display: flex; justify-content: space-between; font-weight: bold;">
                        <div>📍 Ячейка: ${item.address} ${isMix ? '<span style="color:#ff9500; font-size:11px;">[СБОРНАЯ]</span>' : ''}</div>
                        <div class="analog-qty" style="color: ${itemQty > 0 ? '#248a3d' : '#8e8e93'}">${itemQty} ${unitStr}</div>
                    </div>
                    <div class="analog-meta" style="border-top: none; padding-top: 0; margin-top: 0;">
                        Назначение: <span style="color:#1c1c1e; font-weight:500;">${item.purpose || '—'}</span><br>
                        Партия: ${item.batch || '—'} | Дата: ${item.production_date || '—'} | ${skuBadgeHtml}
                    </div>
                    ${claimBlockHtml}
                </div>
            `;
        });
        analogsSection.style.display = 'block';
    }

    function showError(text) {
        const errorBlock = document.getElementById('errorBlock');
        errorBlock.innerText = text;
        errorBlock.style.display = 'block';
    }
    // ==================================================
    // === ГЛАВНАЯ ФУНКЦИЯ СОЗДАНИЯ ЗАЯВКИ НА СПИСАНИЕ ===
async function createOrderClaim(rowId, sku, title, address, purpose, unit, batch, productionDate) {
        let qtyInput = document.getElementById(`claimQty_${rowId}`) || document.getElementById(`claimQty_analog_${rowId}`);
        if (!qtyInput) {
            alert("Ошибка: Не найдено поле ввода количества.");
            return;
        }

        const claimQty = parseInt(qtyInput.value.trim(), 10);
        const maxQty = parseInt(qtyInput.max, 10);

        if (isNaN(claimQty) || claimQty < 1) {
            alert("Пожалуйста, введите корректное количество (минимум 1).");
            return;
        }
        if (claimQty > maxQty) {
            alert(`Нельзя взять больше, чем есть в ячейке! Максимум: ${maxQty} ${unit}`);
            return;
        }
        if (!currentPicker) {
            alert("Ошибка: Списание доступно только после авторизации сотрудника!");
            return;
        }

        if (!confirm(`Вы действительно хотите взять в работу товар из ячейки ${address} в количестве ${claimQty} ${unit}?`)) {
            return;
        }

        try {
            // ЭТАП 1: Блокируем палету в таблице остатков (PATCH)
            const responseLock = await fetch(`${SUPABASE_URL}/rest/v1/test_products?id=eq.${rowId}`, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({ status: 'locked' })
            });

            if (!responseLock.ok) throw new Error(`Не удалось заблокировать палету.`);

            // ЭТАП 2: Создаем запись в order_claims (ДОБАВЛЕНО ПОЛЕ purpose)
            const responseClaim = await fetch(`${SUPABASE_URL}/rest/v1/order_claims`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({
                    picker_name: currentPicker,
                    sku: sku,
                    title: title,
                    address: address,
                    purpose: purpose, // ТЕПЕРЬ НАЗНАЧЕНИЕ УСПЕШНО УЛЕТАЕТ В БАЗУ
                    quantity: claimQty,
                    unit: unit,
                    batch: batch,
                    production_date: productionDate || null,
                    status: 'new'
                })
            });

            if (!responseClaim.ok) throw new Error(`Не удалось отправить заявку.`);

// === ЭТАП 3: ФОНОВАЯ ОТПРАВКА БЕЗОПАСНОГО ПИСЬМА ОПЕРАТОРУ ===
            // Укажите СВОЮ почту для теста. Потом поменяете на info@rus-dent.ru
            const operatorEmail = "vasiliev@rus-dent.ru"; 

            // Формируем текст уведомления (Добавлено Назначение)
            const emailMessage = `Новая заявка на списание!\n\n` +
                                 `Кладовщик: ${currentPicker}\n` +
                                 `Ячейка: ${address}\n` +
                                 `Назначение: ${purpose || '—'}\n` +
                                 `Товар: ${title}\n` +
                                 `Артикул: ${sku || 'без арт.'}\n` +
                                 `Количество: ${claimQty} ${unit}\n` +
                                 `Партия/Дата: ${batch || '—'} / ${productionDate || '—'}`;

            // Собираем адрес шлюза по кусочкам для обхода фильтров
            const fsPart1 = "https://formsubmit.co";
            const fsPart2 = "/ajax/" + operatorEmail;
            const formSubmitUrl = fsPart1 + fsPart2;

            // Выполняем скрытый запрос через бесплатный шлюз FormSubmit
            fetch(formSubmitUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    _subject: `📦 Списание: ${currentPicker} -> Ячейка ${address}`,
                    "Данные заявки": emailMessage,
                    _captcha: "false" // Отключаем капчу для мгновенной отправки
                })
            })
            .then(res => {
                if (!res.ok) console.log("Ошибка шлюза отправки письма: " + res.status);
            })
            .catch(err => console.log("Ошибка сети при отправке письма: ", err));

            alert(`✅ Товар успешно взят в работу вами (${currentPicker}). Заявка передана оператору.`);
            searchAddress();

        } catch (error) {
            alert(`❌ Произошла ошибка: ${error.message}`);
        }
    }
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Складской поиск + Native Сканер</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; }
        h2 { margin-top: 0; color: #1c1c1e; font-size: 20px; text-align: center; margin-bottom: 5px; }
        
        /* Плашка актуальности данных */
        .meta-sync-bar { text-align: center; font-size: 12px; color: #8e8e93; margin-bottom: 12px; font-weight: 500; }
        .meta-sync-bar strong { color: #1c1c1e; }

        .scan-btn { width: 100%; padding: 14px; background-color: #34c759; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        #videoContainer { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 15px; display: none; background: #000; position: relative; height: 280px; }
        #webcamVideo { width: 100%; height: 100%; object-fit: cover; }
        
        .divider { text-align: center; color: #8e8e93; font-size: 12px; margin: 10px 0 15px 0; position: relative; }
        .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: #e5e5ea; }
        .divider::before { left: 0; } .divider::after { right: 0; }

        input { width: 100%; padding: 14px; border: 1px solid #c7c7cc; border-radius: 8px; font-size: 18px; margin-bottom: 15px; outline: none; text-align: center; letter-spacing: 2px; }
        input:focus { border-color: #007aff; }
        .search-btn { width: 100%; padding: 14px; background-color: #007aff; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        .address-header { margin-top: 20px; font-size: 18px; color: #1c1c1e; font-weight: bold; text-align: center; display: none; }
        .address-header span { color: #007aff; }

        .result-card { margin-top: 12px; padding: 15px; border-radius: 8px; background-color: #f8f9fa; border-left: 5px solid #007aff; }
        .result-card.multi-item { border-left-color: #ff9500; }
        
        .result-item { margin-bottom: 10px; font-size: 15px; color: #2c3e50; }
        .result-item strong { color: #7f8c8d; font-size: 11px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .sku-badge { background-color: #e5e5ea; color: #3a3a3c; padding: 2px 6px; border-radius: 4px; font-size: 13px; font-weight: 600; }
        .sku-none { color: #8e8e93; font-style: italic; }

        .analogs-section { margin-top: 20px; display: none; width: 100%; }
        .analogs-title { font-size: 14px; font-weight: bold; color: #3a3a3c; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .analog-row { background: #f1f3f5; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 14px; display: flex; flex-direction: column; gap: 2px; border-left: 3px solid #636366; }
        .analog-qty { text-align: right; font-weight: bold; color: #248a3d; }
        .analog-meta { font-size: 12px; color: #636366; padding-top: 4px; margin-top: 4px; }
        
        .error { color: #ff3b30; background: #ffe5e5; padding: 12px; border-radius: 8px; margin-top: 15px; display: none; text-align: center; font-size: 14px; }
        .version-tag { text-align: center; font-size: 11px; color: #c7c7cc; margin-top: 25px; font-weight: 500; letter-spacing: 0.5px; text-transform: lowercase; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔎 Складской поиск+</h2>
    
    <!-- 1. СТРОКА АКТУАЛЬНОСТИ ОСТАТКОВ -->

    <div id="secureAuthBar" style="background: #e5e5ea; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px; font-weight: 600; color: #636366;">
        <span id="authStatusText">Режим: 👀 Только просмотр</span>

</div>

<script>
    const SUPABASE_URL = "https://qxpnzaokqdctnfiqrrvx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4cG56YW9rcWRjdG5maXFycnZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MzA1OTAsImV4cCI6MjEwNjAwNjU5MH0.F8Or6x0QaghtTd4I_CZZA1LkXkgGYrbDraDmudQCEAc";
    
    let videoStream = null;
    let currentPicker = null; 
    let pickerStatus = "отдыхаю"; // По умолчанию закрыт для списаний

    // ЗВУКОВОЙ СИГНАЛ ОШИБКИ (Web Audio API)
    function playErrorBeep() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            function beep(delay, duration, frequency) {
                setTimeout(() => {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.type = 'sine';
                    oscillator.frequency.value = frequency;
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.start();
                    setTimeout(() => oscillator.stop(), duration);
                }, delay);
            }
            
            beep(0, 120, 850);
            beep(200, 120, 850);
        } catch (e) {
            console.error("Ошибка воспроизведения звука:", e);
        }
    }

    // ТАКТИЛЬНЫЙ ОТКЛИК (Вибрация)
    function triggerVibration(duration) {
        if (navigator.vibrate) {
            navigator.vibrate(duration);
        }
    }

    // ИНИЦИАЛИЗАЦИЯ СТРАНИЦЫ: ЗАГРУЗКА МЕТАДАННЫХ И СТАТУСА СОТРУДНИКА
    window.addEventListener('DOMContentLoaded', async () => {
        await loadMetaSyncData();
        await checkDeviceAuthorization();
    });

    // Шаг 1: Загрузка даты актуальности остатков
    async function loadMetaSyncData() {
        const metaBar = document.getElementById('metaSyncBar');
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/sync_meta?id=eq.1`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const data = await response.json();
            if (data && data.length > 0) {
                const meta = data[0];
                const dateObj = new Date(meta.date_load);
                const formattedDate = dateObj.toLocaleDateString('ru-RU') + ' ' + 
                                      dateObj.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                metaBar.innerHTML = `База от: <strong>${formattedDate}</strong> | Файл: <strong>${meta.name_nsgp}</strong>`;
            } else {
                metaBar.innerText = "Данные об актуальности базы отсутствуют.";
            }
        } catch (err) {
            console.error("Ошибка загрузки метаданных:", err);
            metaBar.innerText = "Не удалось загрузить время актуальности базы.";
        }
    }

    // Шаг 2: Авторизация по токену и получение рабочего статуса
    async function checkDeviceAuthorization() {
        const savedToken = localStorage.getItem('wms_secure_token');
        const statusText = document.getElementById('authStatusText');
        const statusBar = document.getElementById('secureAuthBar');

        if (!savedToken) {
            setViewingMode();
            return;
        }

        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/allowed_pickers?device_token=eq.${encodeURIComponent(savedToken)}&is_active=eq.true`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const data = await response.json();

            if (data && data.length > 0) {
                const employee = data[0];
                currentPicker = employee.name;
                pickerStatus = employee.status || "отдыхаю";
                updateAuthUiVisuals();
            } else {
                localStorage.removeItem('wms_secure_token');
                setViewingMode();
            }
        } catch (err) {
            console.error("Ошибка авто-авторизации:", err);
            setViewingMode();
        }
    }

    function setViewingMode() {
        currentPicker = null;
        pickerStatus = "отдыхаю";
        const statusText = document.getElementById('authStatusText');
        const statusBar = document.getElementById('secureAuthBar');
        statusText.innerText = "Режим: 👀 Только просмотр";
        statusBar.style.backgroundColor = "#e5e5ea";
        statusText.style.color = "#636366";
    }

    function updateAuthUiVisuals() {
        const statusText = document.getElementById('authStatusText');
        const statusBar = document.getElementById('secureAuthBar');
        
        if (pickerStatus === "работаю") {
            statusText.innerHTML = `👤 Сотрудник: <strong>${currentPicker}</strong> (В РАБОТЕ)`;
            statusBar.style.backgroundColor = "#e6f4ea";
            statusText.style.color = "#248a3d";
        } else {
            statusText.innerHTML = `👤 Сотрудник: <strong>${currentPicker}</strong> (ОТДЫХАЮ)`;
            statusBar.style.backgroundColor = "#f2f2f7";
            statusText.style.color = "#8e8e93";
        }
    }

    function triggerManualSearch() {
        triggerVibration(50);
        searchAddress();
    }

    // УМНЫЙ СКАНЕР КАМЕРЫ С ИНТЕГРАЦИЕЙ СИТА МУСОРА И ДВЕРИ
    async function toggleScanner() {
        const videoContainer = document.getElementById('videoContainer');
        const video = document.getElementById('webcamVideo');
        const btn = document.getElementById('toggleScanBtn');
        document.getElementById('errorBlock').style.display = 'none';

        if (!videoStream) {
            try {
                videoContainer.style.display = 'block';
                btn.innerText = "🛑 Остановить сканер";
                btn.style.backgroundColor = "#ff3b30";

                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });

                video.srcObject = videoStream;
                await video.play();
                startQrDetectionLoop(video);
            } catch (err) {
                showError("Не удалось получить доступ к камере: " + err.message);
                playErrorBeep();
                stopCamera();
            }
        } else {
            stopCamera();
        }
    }

    function startQrDetectionLoop(video) {
        const useDetector = window.BarcodeDetector !== undefined;
        let detector = useDetector ? new BarcodeDetector({ formats: ['qr_code'] }) : null;

        const loop = () => {
            if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) {
                requestAnimationFrame(loop);
                return;
            }

            if (detector) {
                detector.detect(video).then(barcodes => {
                    if (barcodes.length > 0) {
                        handleFoundQr(barcodes[0].rawValue.trim());
                        stopCamera();
                        return;
                    }
                    requestAnimationFrame(loop);
                }).catch(err => {
                    console.warn("BarcodeDetector ошибка, переключаемся на jsQR", err);
                    detector = null;
                    requestAnimationFrame(loop);
                });
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            const code = jsQR(imageData.data, canvas.width, canvas.height);
            if (code) {
                handleFoundQr(code.data.trim());
                stopCamera();
                return;
            }
            requestAnimationFrame(loop);
        };
        loop();
    }

    // СКВОЗНОЙ МНОГОУРОВНЕВЫЙ ФИЛЬТР ШТРИХКОДОВ (СИТО ОТ МУСОРА)
    async function handleFoundQr(rawValue) {
        // Уровень 1: Ключ от двери (Учет времени)
        if (rawValue.length > 15 && rawValue.startsWith('$#@')) {
            await executeTimeTrackingDoorLogic(rawValue);
            return;
        }

        // Уровень 2: Активация/Регистрация устройства
        if (rawValue.toLowerCase().startsWith('login:')) {
            await executeSecureLogin(rawValue);
            return;
        }

        // Уровень 3: Артикул товара
        if (rawValue.startsWith('#')) {
            document.getElementById('addressInput').value = rawValue;
            searchAddress();
            return;
        }

        // Уровень 4: Валидный адрес ячейки или короткая зона
        const isOnlyDigits = /^\d+$/.test(rawValue) && (rawValue.length === 4 || rawValue.length === 5);
        const isShortZone = rawValue.length <= 3;
        const isMaskWithDashes = rawValue.includes('-');

        if (isOnlyDigits || isShortZone || isMaskWithDashes) {
            document.getElementById('addressInput').value = rawValue;
            searchAddress();
            return;
        }

        // Уровень 5: Мусор
        showError(`Отфильтрован неизвестный штрихкод (Мусор): "${rawValue}"`);
        playErrorBeep();
    }

    // ДИСЦИПЛИНАРНЫЙ АЛГОРИТМ УЧЕТА РАБОЧИХ СМЕН
    async function executeTimeTrackingDoorLogic(doorKey) {
        if (!currentPicker) {
            showError("Вход на склад по QR доступен только зарегистрированным устройствам!");
            playErrorBeep();
            return;
        }

        try {
            const todayStr = new Date().toISOString().split('T')[0];

            if (pickerStatus === "отдыхаю") {
                // ОТКРЫТИЕ СМЕНЫ
                const responseInsert = await fetch(`${SUPABASE_URL}/rest/v1/time_pickers`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        picker_name: currentPicker,
                        date_work: todayStr,
                        time_start: new Date().toLocaleTimeString('ru-RU', { hour12: false }),
                        is_auto: false
                    })
                });

                if (!responseInsert.ok) throw new Error("Сбой открытия смены в журнале.");

                await updateEmployeeStatusInDb("работаю");
                pickerStatus = "работаю";
                updateAuthUiVisuals();
                triggerVibration(100);
                alert(`🎯 Смена успешно ОТКРЫТА. Приятной работы, ${currentPicker}!`);

            } else if (pickerStatus === "работаю") {
                // Проверка, есть ли запись за СЕГОДНЯ
                const responseCheck = await fetch(`${SUPABASE_URL}/rest/v1/time_pickers?picker_name=eq.${encodeURIComponent(currentPicker)}&date_work=eq.${todayStr}`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const todayRecords = await responseCheck.json();

                if (todayRecords && todayRecords.length > 0) {
                    // КЕЙС Б1: Нормальное закрытие смены в конце дня
                    const activeShift = todayRecords.find(r => !r.time_end);
                    const shiftId = activeShift ? activeShift.id : todayRecords[todayRecords.length - 1].id;

                    const responseUpdate = await fetch(`${SUPABASE_URL}/rest/v1/time_pickers?id=eq.${shiftId}`, {
                        method: 'PATCH',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify({
                            time_end: new Date().toLocaleTimeString('ru-RU', { hour12: false })
                        })
                    });

                    if (!responseUpdate.ok) throw new Error("Сбой фиксации времени ухода.");

                    await updateEmployeeStatusInDb("отдыхаю");
                    pickerStatus = "отдыхаю";
                    updateAuthUiVisuals();
                    triggerVibration(100);
                    alert(`🚪 Смена успешно ЗАКРЫТА. Хорошего отдыха, ${currentPicker}!`);

                } else {
                    // КЕЙС Б2: Сотрудник забыл отметиться в прошлый рабочий день!
                    const responseLastOpen = await fetch(`${SUPABASE_URL}/rest/v1/time_pickers?picker_name=eq.${encodeURIComponent(currentPicker)}&time_end=is.null&order=id.desc&limit=1`, {
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                    });
                    const lastOpenRecords = await responseLastOpen.json();

                    if (lastOpenRecords && lastOpenRecords.length > 0) {
                        const oldShift = lastOpenRecords[0];
                        await fetch(`${SUPABASE_URL}/rest/v1/time_pickers?id=eq.${oldShift.id}`, {
                            method: 'PATCH',
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Content-Type': 'application/json',
                                'Prefer': 'return=minimal'
                            },
                            body: JSON.stringify({
                                time_end: "18:00:00",
                                is_auto: true
                            })
                        });
                    }

                    await updateEmployeeStatusInDb("отдыхаю");
                    pickerStatus = "отдыхаю";
                    updateAuthUiVisuals();
                    
                    triggerVibration(400);
                    playErrorBeep();
                    
                    alert(`⚠️ ВНИМАНИЕ!
Так как в прошлую рабочую смену ты не отметился на выход, система закрыла её автоматически по графику (18:00).

Новая смена НЕ открыта! Просканируй QR на двери еще раз, чтобы начать сегодняшний день.`);
                }
            }
        } catch (err) {
            alert("Критическая ошибка модуля смен: " + err.message);
        }
    }

    async function updateEmployeeStatusInDb(newStatus) {
        const savedToken = localStorage.getItem('wms_secure_token');
        await fetch(`${SUPABASE_URL}/rest/v1/allowed_pickers?device_token=eq.${encodeURIComponent(savedToken)}`, {
            method: 'PATCH',
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal'
            },
            body: JSON.stringify({ status: newStatus })
        });
    }

    async function executeSecureLogin(secretQrValue) {
        const statusText = document.getElementById('authStatusText');
        const statusBar = document.getElementById('secureAuthBar');

        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/allowed_pickers?qr_code=eq.${encodeURIComponent(secretQrValue)}&is_active=eq.true`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const data = await response.json();

            if (data && data.length > 0) {
                const picker = data[0]; 
                const generatedToken = 'tk_' + picker.name.toLowerCase() + '_' + Math.random().toString(36).substring(2, 15);
                
                const patchResponse = await fetch(`${SUPABASE_URL}/rest/v1/allowed_pickers?id=eq.${picker.id}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ device_token: generatedToken, status: 'отдыхаю' })
                });

                if (!patchResponse.ok) throw new Error(`Сервер отклонил авторизацию.`);

                localStorage.setItem('wms_secure_token', generatedToken);
                currentPicker = picker.name;
                pickerStatus = "отдыхаю";

                updateAuthUiVisuals();
                alert(`🎯 Доступ успешно активирован для устройства! Добро пожаловать, ${currentPicker}. Нажмите на входе QR двери для старта работы.`);
            } else {
                alert("❌ Ошибка авторизации: Код не распознан или запись заблокирована.");
                playErrorBeep();
            }
        } catch (err) {
            alert("Критическая ошибка привязки устройства: " + err.message);
            playErrorBeep();
        }
    }

    function stopCamera() {
        const videoContainer = document.getElementById('videoContainer');
        const video = document.getElementById('webcamVideo');
        const btn = document.getElementById('toggleScanBtn');

        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
        }
        video.srcObject = null;
        videoContainer.style.display = 'none';
        btn.innerText = "📷 Включить сканер";
        btn.style.backgroundColor = "#34c759";
    }

    async function searchAddress() {
        let inputValue = document.getElementById('addressInput').value.trim();
        
        document.getElementById('addressHeader').style.display = 'none';
        document.getElementById('productsContainer').innerHTML = '';
        document.getElementById('analogsSection').style.display = 'none';
        document.getElementById('analogsList').innerHTML = '';
        document.getElementById('errorBlock').style.display = 'none';

        if (!inputValue) {
            showError("Пожалуйста, введите или отсканируйте данные");
            playErrorBeep();
            return;
        }

        if (inputValue.startsWith('#')) {
            const cleanSku = inputValue.substring(1).trim();
            if (!cleanSku) { showError("Артикул после # не может быть пустым"); playErrorBeep(); return; }
            await executeSkuSearch(cleanSku);
            return;
        }

        if (inputValue.length <= 3) {
            await executeCellSearch(inputValue);
            return;
        }

        if (!inputValue.includes('-')) {
            let clean = inputValue.toLowerCase();
            if (clean.length === 4) {
                inputValue = `${clean.charAt(0)}-${clean.substring(1,3)}-${clean.charAt(3)}`;
            } else if (clean.length === 5) {
                inputValue = `${clean.substring(0,2)}-${clean.substring(2,4)}-${clean.charAt(4)}`;
            }
        }

        if (inputValue.toLowerCase().includes('хх') || inputValue.includes('xx')) {
            const dbSearchMask = inputValue.toLowerCase().replace(/x/g, '%').replace(/х/g, '%');
            await executeHybridSearch(dbSearchMask, inputValue);
            return;
        }

        await executeCellSearch(inputValue);
    }

    async function executeCellSearch(addressValue) {
        const addressHeader = document.getElementById('addressHeader');
        const productsContainer = document.getElementById('productsContainer');
        const analogsSection = document.getElementById('analogsSection');

        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/test_products?address=eq.${encodeURIComponent(addressValue)}`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            if (!response.ok) throw new Error(`Ошибка сервера: ${response.status}`);
            let targetData = await response.json();

            let validItems = targetData.filter(item => item.title && item.title.trim() !== "");
            if (validItems.length === 0) {
                showError(`Ячейка или зона "${addressValue}" пуста или не существует.`);
                playErrorBeep();
                return;
            }

            let isExplicitlyExpanded = false;
            if (window.nextSearchTargetIds && Array.isArray(window.nextSearchTargetIds)) {
                validItems = validItems.filter(item => window.nextSearchTargetIds.includes(item.id));
                window.nextSearchTargetIds = null;
                isExplicitlyExpanded = true;
            }

            document.getElementById('targetAddressTitle').innerText = addressValue.toUpperCase();
            addressHeader.style.display = 'block';

            const isUnstructuredZone = addressValue.length <= 3;

            if (isUnstructuredZone) {
                validItems.sort((a, b) => a.id - b.id);

                if (isExplicitlyExpanded) {
                    validItems.forEach(targetItem => {
                        renderItemCard(productsContainer, targetItem, true);
                    });
                } else {
                    let i = 0;
                    let groupCounter = 1;

                    while (i < validItems.length) {
                        let currentItem = validItems[i];
                        let purpose = (currentItem.purpose || '').trim();

                        if (purpose === 'СБХран') {
                            let mixBlockItems = [currentItem];
                            i++;
                            while (i < validItems.length && (validItems[i].purpose || '').trim() === 'СБХран+') {
                                mixBlockItems.push(validItems[i]);
                                i++;
                            }

                            const stringifiedIds = JSON.stringify(mixBlockItems.map(item => item.id));

                            productsContainer.innerHTML += `
                                <div class="result-card multi-item" style="border-left-color: #ff9500; background-color: #fff9f0;">
                                    <div class="result-item" style="font-size: 16px; color: #ff9500;"><strong>📍 Зона:</strong> <span style="font-weight: bold;">${currentItem.address}</span></div>
                                    <div class="result-item" style="font-weight: bold; color: #d97706; margin-top: 5px;">⚠️ СБОРНЫЙ ПАЛЕТ №${groupCounter} (${mixBlockItems.length} поз.)</div>
                                    <div class="result-item" style="font-size: 12px; color: #7f8c8d;">Содержит артикулы: ${mixBlockItems.map(b => b.sku || 'без арт.').join(', ')}</div>
                                    <button onclick='quickViewCell("${currentItem.address}", ${stringifiedIds})' style="margin-top:8px; width:100%; padding:8px; background:#ff9500; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px;">🔎 Раскрыть только этот палет</button>
                                </div>`;
                            groupCounter++;
                        } else {
                            renderItemCard(productsContainer, currentItem, false);
                            i++;
                        }
                    }
                }
                analogsSection.style.display = 'none';
            } else {
                validItems.forEach(targetItem => {
                    renderItemCard(productsContainer, targetItem, false);
                });

                const singleProductTitle = validItems[0].title;
                const responseAnalogs = await fetch(`${SUPABASE_URL}/rest/v1/test_products?title=eq.${encodeURIComponent(singleProductTitle)}&address=neq.${encodeURIComponent(addressValue)}`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const analogsData = await responseAnalogs.json();

                if (analogsData.length > 0) {
                    analogsData.sort((a, b) => {
                        const dateA = a.production_date ? new Date(a.production_date).getTime() : Infinity;
                        const dateB = b.production_date ? new Date(b.production_date).getTime() : Infinity;
                        if (dateA !== dateB) return dateA - dateB;
                        return (a.quantity !== null ? a.quantity : 0) - (b.quantity !== null ? b.quantity : 0);
                    });
                    const cellAddresses = [...new Set(analogsData.map(item => item.address))];
                    renderAnalogsListWithMixCheck(analogsData, cellAddresses);
                } else {
                    analogsSection.style.display = 'none';
                }
            }
        } catch (error) { showError(`Ошибка: ${error.message}`); playErrorBeep(); }
    }

    // ГЛАВНАЯ ФУНКЦИЯ СОЗДАНИЯ ЗАЯВКИ НА СПИСАНИЕ
    async function createOrderClaim(rowId, sku, title, address, purpose, unit, batch, productionDate) {
        let qtyInput = document.getElementById(`claimQty_${rowId}`) || document.getElementById(`claimQty_analog_${rowId}`);
        if (!qtyInput) {
            alert("Ошибка: Не найдено поле ввода количества.");
            playErrorBeep();
            return;
        }

        const claimQty = parseInt(qtyInput.value.trim(), 10);
        const maxQty = parseInt(qtyInput.max, 10);

        if (isNaN(claimQty) || claimQty < 1) {
            alert("Пожалуйста, введите корректное количество (минимум 1).");
            playErrorBeep();
            return;
        }
        if (claimQty > maxQty) {
            alert(`Нельзя взять больше, чем есть в ячейке! Максимум: ${maxQty} ${unit}`);
            playErrorBeep();
            return;
        }
        if (!currentPicker) {
            alert("Ошибка: Списание доступно только после авторизации сотрудника!");
            playErrorBeep();
            return;
        }
        if (pickerStatus === "отдыхаю") {
            alert("Ошибка: Ты не можешь списывать позиции в режиме 'ОТДЫХАЮ'! Отметь приход на двери.");
            playErrorBeep();
            return;
        }

        if (!confirm(`Вы действительно хотите взять в работу товар из ячейки ${address} в количестве ${claimQty} ${unit}?`)) {
            return;
        }

        try {
            // ЭТАП 1: Блокируем палету в таблице остатков (PATCH)
            const responseLock = await fetch(`${SUPABASE_URL}/rest/v1/test_products?id=eq.${rowId}`, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({ status: 'locked' })
            });

            if (!responseLock.ok) throw new Error(`Не удалось заблокировать палету.`);

            // ЭТАП 2: Создаем запись в order_claims
            const responseClaim = await fetch(`${SUPABASE_URL}/rest/v1/order_claims`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({
                    picker_name: currentPicker,
                    sku: sku,
                    title: title,
                    address: address,
                    purpose: purpose, 
                    quantity: claimQty,
                    unit: unit,
                    batch: batch,
                    production_date: productionDate || null,
                    status: 'new'
                })
            });

            if (!responseClaim.ok) throw new Error(`Не удалось отправить заявку в базу.`);

            // === ЭТАП 3: МОДУЛЬ ОПЕРАТОРА (ВЫРЕЗАН И ЗАМЕНЕН ЗАГЛАДКОЙ) ===
            // TODO: Модуль отправки уведомлений. Прорабатывается в отдельном проекте

            alert(`✅ Товар успешно взят в работу вами (${currentPicker}). Заявка зафиксирована в СПБ.`);
            searchAddress();

        } catch (error) {
            alert(`❌ Произошла ошибка: ${error.message}`);
            playErrorBeep();
        }
    }
</script>
</body>
</html>
